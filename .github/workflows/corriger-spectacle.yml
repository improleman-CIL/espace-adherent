name: Corriger le vocabulaire spectacle

on:
  push:
    paths:
      - '.github/workflows/corriger-spectacle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Remplacer les intitulés génériques
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Checklist — organiser un match': 'Checklist — organiser un spectacle',
              'Aider à organiser un match': 'Aider à organiser un spectacle',
              'Je veux aider sur un match': 'Je veux aider sur un spectacle',
          }

          changed = []
          for old, new in replacements.items():
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  changed.append(f'{old} -> {new} ({count})')

          if not changed:
              raise SystemExit('Aucun des intitulés attendus n’a été trouvé dans index.html')

          path.write_text(text, encoding='utf-8')
          print('\n'.join(changed))

      - name: Enregistrer la correction
        run: |
          git config user.name "CIL site bot"
          git config user.email "improleman@gmail.com"
          git add index.html
          git commit -m "Remplace match par spectacle dans les intitulés génériques"
          git push
