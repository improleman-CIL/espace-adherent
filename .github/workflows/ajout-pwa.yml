name: Ajouter la PWA CIL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajout-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ajouter le bouton et le branchement PWA
        env:
          PWA_PATCH: 
        run: |
          printf '%s' "$PWA_PATCH" | base64 --decode > /tmp/pwa.patch
          git apply --check /tmp/pwa.patch
          git apply /tmp/pwa.patch

      - name: Vérifier la PWA
        run: |
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          grep -q 'id="install-app"' index.html
          grep -q 'manifest.webmanifest' index.html

      - name: Publier la modification
        run: |
          if git diff --quiet -- index.html; then
            echo "La PWA est déjà installée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Branche la PWA sur la page d’accueil"
          git push
