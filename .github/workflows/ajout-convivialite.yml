name: Ajout moment convivial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajout-convivialite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ajouter le moment convivial
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<strong>Moment convivial</strong>'
          if marker in s:
              print('Déjà présent, aucune modification.')
              raise SystemExit(0)
          old = '''            <div class="day-time">Fin + 30 min</div><div class="day-action"><strong>Rangement collectif</strong><span>Remise en état, inventaire matériel, déchets, vérification finale et fermeture.</span></div>'''
          new = old + '''\n            <div class="day-time">Après rangement</div><div class="day-action"><strong>Moment convivial</strong><span>Quand c’est possible, on termine ensemble autour d’un repas ou d’un moment partagé : l’occasion de débriefer, remercier les équipes et profiter du collectif.</span></div>'''
          if old not in s:
              raise SystemExit('Bloc cible introuvable dans index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Enregistrer la modification
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajoute un moment convivial après le rangement"
          git push
